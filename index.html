<style>

<div class="app">
<aside><div class="logo">EduManage AI<small>Quản lý chuyên môn đa điểm trường</small></div><nav id="nav"></nav></aside>
<main>
<div class="top"><button class="btn g" onclick="sb()" aria-label="Thu gọn hoặc mở menu">☰</button><div><h1>Trường Tiểu học Đỗ Thúc Tịnh</h1><p>Năm học 2026–2027 · Học kỳ I</p></div>
<div class="who"><select id="rl" onchange="setRole(this.value)" aria-label="Xem thử theo vai trò"><option value="bgh">Xem thử: Cán bộ quản lý</option><option value="tt">Xem thử: Tổ trưởng</option><option value="gv">Xem thử: Giáo viên</option><option value="ad">Xem thử: Quản trị</option></select><select id="mg" aria-label="Cán bộ quản lý" style="display:none" onchange="setMg(this.value)"></select><select id="tt2" aria-label="Tổ phụ trách" style="display:none" onchange="ttTo=this.value;fl.to='';selId=null;render()"></select>
<button class="btn g" onclick="bell()" aria-label="Thông báo">🔔 <span id="bc"></span></button><button class="btn g" onclick="window.print()" aria-label="In trang hiện tại">🖨</button><button class="btn g" onclick="theme()" aria-label="Đổi chế độ sáng/tối">◐</button>
<div><b id="un"></b><br><span class="note" id="ul"></span></div><div class="av" id="av"></div></div></div>
<div class="ban" id="ban"></div>
<div class="ct" id="v"></div></main></div>
<dialog id="dlg"></dialog>
<dialog id="cf"><p id="cm"></p><div class="bar"><span class="sp"></span><button class="btn g" onclick="$('cf').close()">Hủy</button><button class="btn" id="cy">Xác nhận</button></div></dialog>

<script>
const KEY='edm-v3b',OLD='edm-none',TZ='Asia/Ho_Chi_Minh',BASE=Date.UTC(2026,8,21),PG=10;
const nowTs=()=>new Date().toLocaleString('sv-SE',{timeZone:TZ}),TODAY=nowTs().slice(0,10);
const wkOf=iso=>Math.floor((Date.parse(iso.slice(0,10))-BASE)/6048e5)+1,CW=wkOf(TODAY);
const SUB=['Đã nộp','Đang rà soát','Cần chỉnh sửa','Chờ duyệt','Đã duyệt','Từ chối'];
const ALLST=['Chưa nộp','Bản nháp','Đã nộp','Đang rà soát','Cần chỉnh sửa','Chờ duyệt','Đã duyệt','Từ chối','Thu hồi'];
const STC={'Đã duyệt':'ok','Chờ duyệt':'wa','Đang rà soát':'wa','Cần chỉnh sửa':'er','Từ chối':'er','Chưa nộp':'er'};
const TY=['Kế hoạch bài dạy','Kế hoạch giáo dục','Biên bản sinh hoạt','Phiếu dự giờ','Báo cáo chuyên môn','Sổ chủ nhiệm','Kế hoạch giáo dục cá nhân HSKT'],TO=['Tổ 1','Tổ 2','Tổ 3','Tổ 4','Tổ 5'];
const AC={nop:['Đã nộp','Nộp hồ sơ'],thuhoi:['Thu hồi','Thu hồi hồ sơ'],ver:['Đã nộp','Nộp phiên bản mới'],rs:['Đang rà soát','Bắt đầu rà soát'],cho:['Chờ duyệt','Chuyển chờ duyệt'],duyet:['Đã duyệt','Phê duyệt'],sua:['Cần chỉnh sửa','Yêu cầu chỉnh sửa'],tc:['Từ chối','Từ chối hồ sơ']};
const R={bgh:{n:'Ngô Thị Bông',l:'Phó Hiệu trưởng'},tt:{n:'Trần Văn Hòa',l:'Tổ trưởng chuyên môn'},gv:{n:'Nguyễn Thị Lan',l:'Giáo viên',tid:'GV001'},ad:{n:'Quản trị hệ thống',l:'Quản trị viên',av:'QT'}};
const $=id=>document.getElementById(id),pc=(a,b)=>Math.round(a/b*100),fr=r=>r==null?'—':r+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cnt=(ds,s)=>ds.filter(d=>d.st==s).length,pill=(s,c)=>`<span class="pill p-${c||STC[s]||'mu'}">${esc(s)}</span>`;
const opt=(a,v)=>a.map(([k,l])=>`<option value="${esc(k)}"${k==v?' selected':''}>${esc(l)}</option>`).join('');

const CR=[["Yêu cầu cần đạt", "Ghi đúng yêu cầu cần đạt của bài theo chương trình, có cả phẩm chất, năng lực. Có yêu cầu cần đạt riêng đối với lớp có học sinh khuyết tật"], ["Đồ dùng dạy học", "Nêu rõ đồ dùng của giáo viên và học sinh, phù hợp hoạt động"], ["Hoạt động Khởi động", "Có mục tiêu, cách tổ chức, tạo hứng thú và kết nối bài mới"], ["Hoạt động hình thành kiến thức mới", "Học sinh tự khám phá, có hình thức tổ chức cụ thể (cá nhân, nhóm). Có thể hiện nhiệm vụ ngắn gọn với HSKT (nếu có)"], ["Hoạt động luyện tập, thực hành", "Bài tập bám yêu cầu cần đạt, có phân hoá học sinh. Có thể hiện nhiệm vụ ngắn gọn với HSKT (nếu có)"], ["Hoạt động vận dụng, trải nghiệm", "Liên hệ thực tế, đời sống của học sinh. Có thể hiện nhiệm vụ ngắn gọn với HSKT (nếu có)"], ["Đánh giá thường xuyên", "Có cách nhận xét, đánh giá học sinh trong tiết học theo Thông tư 27/2020"], ["Điều chỉnh sau bài dạy", "Có ghi điều chỉnh (nếu bài đã dạy)"], ["Tích hợp giáo dục địa phương, lồng ghép nội dung giáo dục AI, kĩ năng công dân số...", "Có ghi nội dung tích hợp, lồng ghép tại mục yêu cầu cần đạt, trước mục đồ dùng dạy học"]],PR="Vai trò: Bạn là tổ trưởng chuyên môn trường tiểu học, rà soát kế hoạch bài dạy (KHBD) theo Chương trình GDPT 2018 để góp ý nội bộ. Không chấm điểm, không xếp loại giáo viên.\n\nTHÔNG TIN DO TỔ TRƯỞNG ĐIỀN\n- Môn / lớp / bài: [điền]\n- Lớp có học sinh khuyết tật (HSKT): [Có / Không]\n- Bài đã dạy: [Đã dạy / Chưa dạy]\n\nBẢO MẬT: Nếu bài còn tên học sinh, giáo viên hoặc thông tin nhận dạng, thay bằng [tên] trong mọi phần trả lời.\n\n9 TIÊU CHÍ\n1. Yêu cầu cần đạt: đúng yêu cầu của bài, có phẩm chất, năng lực; nếu lớp có HSKT thì có yêu cầu riêng cho HSKT.\n2. Đồ dùng dạy học: nêu rõ của giáo viên và học sinh, phù hợp hoạt động.\n3. Hoạt động khởi động: có mục tiêu, cách tổ chức, tạo hứng thú, kết nối bài mới.\n4. Hoạt động hình thành kiến thức mới: học sinh tự khám phá, hình thức tổ chức cụ thể (cá nhân, nhóm); nếu có HSKT thì có nhiệm vụ ngắn gọn cho HSKT.\n5. Hoạt động luyện tập, thực hành: bám yêu cầu cần đạt, có phân hóa học sinh; nếu có HSKT thì có nhiệm vụ cho HSKT.\n6. Hoạt động vận dụng, trải nghiệm: liên hệ thực tế, đời sống học sinh; nếu có HSKT thì có nhiệm vụ cho HSKT.\n7. Đánh giá thường xuyên: có cách nhận xét, đánh giá học sinh trong tiết học theo Thông tư 27/2020/TT-BGDĐT (đã được sửa đổi, bổ sung).\n8. Điều chỉnh sau bài dạy: có ghi điều chỉnh nếu bài đã dạy.\n9. Tích hợp, lồng ghép (giáo dục địa phương, nội dung giáo dục AI, kĩ năng công dân số...): có ghi ở mục yêu cầu cần đạt, trước mục đồ dùng dạy học.\n\nQUY TẮC ĐÁNH GIÁ\n- Mỗi tiêu chí chọn đúng một kết quả: \"Đạt\", \"Chưa đạt\" hoặc \"Không áp dụng\".\n- \"Chưa đạt\" khi mục có nhưng thiếu ý của tiêu chí, hoặc không thấy mục đó (ghi \"Không thấy trong bài\").\n- Không có HSKT: phần HSKT trong tiêu chí 1, 4, 5, 6 không tính, các ý còn lại vẫn đánh giá bình thường. Bài chưa dạy: tiêu chí 8 là \"Không áp dụng\".\n- Dẫn chứng phải trích nguyên văn, tối đa 15 từ, đặt trong ngoặc kép. Không diễn đạt lại rồi trình bày như trích dẫn. Không có thì ghi \"Không thấy trong bài\".\n- Chỉ dựa vào nội dung bài. Không thêm kiến thức môn học, không góp ý ngoài 9 tiêu chí. Không chắc thì ghi \"Cần tổ trưởng kiểm tra\", không đoán.\n\nĐỊNH DẠNG TRẢ LỜI\nA. Bảng 4 cột: Tiêu chí | Kết quả | Dẫn chứng | Gợi ý sửa (tối đa 2 câu, cụ thể, làm được ngay).\nB. Nhận xét gửi giáo viên (xưng \"thầy/cô\", 3–4 câu, giọng nhã nhặn): nêu 1 điểm làm tốt cụ thể, rồi 1–2 việc cần sửa ưu tiên (theo các tiêu chí Chưa đạt). Không khen chung chung. Nếu nhiều tiêu chí chưa đạt thì nói rõ nhưng lịch sự.\nC. Dòng cuối cùng, đúng cú pháp, để dán vào phần mềm (Đ = Đạt, C = Chưa đạt, K = Không áp dụng):\nKQ: 1=?; 2=?; 3=?; 4=?; 5=?; 6=?; 7=?; 8=?; 9=?\n\nKế hoạch bài dạy:\n[Dán nội dung kế hoạch bài dạy vào đây]",AB={'Kế hoạch bài dạy':'KHBD','Kế hoạch giáo dục':'KHGD','Biên bản sinh hoạt':'BBSH','Phiếu dự giờ':'PDG','Báo cáo chuyên môn':'BCCM','Sổ chủ nhiệm':'SCN','Kế hoạch giáo dục cá nhân HSKT':'KH function rv(id){const d=doc(id),r=d.rv||{c:[],ai:'',min:'',gem:'',wrong:'',note:'',ok:false},ed=role=='tt'&&d.st=='Đang rà soát',dis=ed?'':'disabled';

${r.ok?`<p class="note">Đã xác nhận bởi ${esc(r.by)} lúc ${esc(r.at)}. Gửi giáo viên bằng thao tác “Yêu cầu chỉnh sửa” hoặc “Chuyển chờ duyệt” trong hồ sơ.</p>`:''}

function rvSave(id,ok){const d=doc(id);if(role!='tt'||d.st!='Đang rà soát')return;const v=k=>$(k).value.trim(),c=CR.map((_,i)=>$('c'+i).value),r={ai:v('r1'),min:v('r2'),gem:v('r3'),wrong:v('r4'),note:v('r5'),c};

if(ok){if(!r.ai)return toast('Hãy chọn có dùng AI hay không',1);if(r.min==='')return toast('Hãy nhập thời gian rà soát (phút)',1);if(r.ai=='Có'&&(!r.gem||r.wrong===''))return toast('Có dùng AI: hãy dán nhận xét của Gemini và ghi số nhận định AI sai (có thể là 0)',1);if(d.ty==TY[0]&&c.includes(''))return toast('Hãy tích Đạt/Chưa đạt cho cả 9 tiêu chí',1)}
d.rv=Object.assign(r,{ver:d.ver.length,ok:!!ok,by:ME().n,at:nowTs()});if(ok)d.log.push({at:nowTs(),by:ME().n+' ('+ME().l+')',act:'Xác nhận phiếu rà soát (Có dùng AI: '+r.ai+', '+r.min+' phút)',note:''});
aud((ok?'Xác nhận':'Lưu nháp')+' phiếu rà soát: '+d.name);save();$('dlg').close();render();toast(ok?'Đã xác nhận phiếu rà soát':'Đã lưu nháp phiếu')}

.edb-h button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px}
#edb-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);font-size:14px}
.edb-m{max-width:88%;padding:9px 12px;border-radius:12px;line-height:1.5;overflow-wrap:anywhere}
.edb-m.b{background:var(--card);border:1px solid var(--ln);align-self:flex-start}
.edb-m.u{background:var(--blue);color:#fff;align-self:flex-end}
.edb-m p{margin:0 0 6px}.edb-m p:last-child{margin:0}.edb-m ol{margin:4px 0 6px;padding-left:20px}.edb-m li{margin:3px 0}
.edb-a,.edb-chip{font:inherit;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid var(--ln);background:var(--sel);color:var(--tx);padding:6px 10px;margin:4px 6px 0 0}
.edb-a:hover,.edb-chip:hover{border-color:var(--blue)}
.edb-row{display:block;width:100%;text-align:left;font:inherit;font-size:13px;cursor:pointer;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;margin-top:5px}
.edb-row:hover{border-color:var(--blue)}.edb-row .note{display:block}
#edb-chips{padding:6px 10px 0;background:var(--bg);border-top:1px solid var(--ln)}
.edb-f{display:flex;gap:8px;padding:10px;border-top:1px solid var(--ln);background:var(--card)}
#edb-in{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
#edb-send{border:0;border-radius:8px;padding:0 16px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}
#toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
@media print{#edb{display:none!important}}
</style>
<div id="edb">
  <button id="edb-btn" aria-expanded="false" aria-controls="edb-box"><span aria-hidden="true">🤖</span> EduBot AI</button>
  <section id="edb-box" role="dialog" aria-label="EduBot AI, trợ lý nghiệp vụ chuyên môn">
    <div class="edb-h"><span aria-hidden="true" style="font-size:24px">🤖</span><div><b>EduBot AI</b><small>Hỗ trợ nghiệp vụ chuyên môn</small></div><button id="edb-x" aria-label="Đóng EduBot">✕</button></div>
    <div id="edb-msgs" role="log" aria-live="polite"></div>
    <div id="edb-chips"></div>
    <div class="edb-f"><input id="edb-in" type="text" maxlength="500" placeholder="Nhập câu hỏi..." aria-label="Nhập câu hỏi cho EduBot" autocomplete="off"><button id="edb-send">Gửi</button></div>
  </section>
</div>
<script>
(()=>{
const g=id=>document.getElementById(id),box=g('edb'),msgs=g('edb-msgs'),inp=g('edb-in'),chips=g('edb-chips');
const nz=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
let wantBug=false;
const CHIPS=['Cách nộp sổ chủ nhiệm thế nào?','Hồ sơ của tôi hiện ra sao?','Xem lịch sử rà soát AI ở đâu?','Báo lỗi phần mềm'];
chips.innerHTML=CHIPS.map(c=>`<button class="edb-chip" data-q="${esc(c)}">${esc(c)}</button>`).join('');

function add(cls,html,txt){const m=document.createElement('div');m.className='edb-m '+cls;if(txt!=null)m.textContent=txt;else m.innerHTML=html;msgs.appendChild(m);msgs.scrollTop=msgs.scrollHeight;return m}
const btnGo=(i,l)=>`<button class="edb-a" data-go="${i}">${esc(l)}</button>`;

/* 1. Hướng dẫn nghiệp vụ: bám đúng các màn hình và nút có trong hệ thống */
const KB=[
{k:['nop','tao ho so','so chu nhiem','gui ho so','nop ho so','giao an'],go:[3,'Mở Hồ sơ chuyên môn'],
 a:'<p><b>Nộp hồ sơ (giáo viên):</b></p><ol><li>Vào <b>📁 Hồ sơ chuyên môn</b>, bấm <b>+ Tạo hồ sơ</b>.</li><li>Nhập tên hồ sơ, chọn loại (ví dụ <i>Sổ chủ nhiệm</i>), chọn tệp và hạn nộp rồi lưu.</li><li>Mở hồ sơ vừa tạo, dán đường dẫn Q.DOC nếu có, rồi bấm <b>Nộp hồ sơ</b>.</li></ol><p class="note">Hồ sơ ở trạng thái Chưa nộp, Bản nháp, Thu hồi hoặc Cần chỉnh sửa thì mới nộp được. Hệ thống chỉ lưu tên tệp, nên hãy để bản chính trên Q.DOC.</p>'},
{k:['quy trinh','phe duyet','duyet ho so','ra soat','to truong','trang thai'],go:[3,'Mở Hồ sơ chuyên môn'],
 a:'<p><b>Quy trình một hồ sơ:</b></p><ol><li>Giáo viên <b>Nộp hồ sơ</b>.</li><li>Tổ trưởng bấm <b>Bắt đầu rà soát</b>, hoàn tất phiếu 9 tiêu chí, rồi <b>Chuyển chờ duyệt</b> (hoặc <b>Yêu cầu chỉnh sửa</b>).</li><li>Cán bộ quản lý <b>Phê duyệt</b>, <b>Yêu cầu chỉnh sửa</b> hoặc <b>Từ chối</b>.</li></ol><p class="note">Nếu bị yêu cầu chỉnh sửa, giáo viên sửa rồi nộp lại. Hồ sơ đã duyệt vẫn có thể <b>Nộp phiên bản mới</b>.</p>'},
{k:['lich su','xem lich su','nhat ky','ai ra soat','cua ai','gemini','phieu ra soat'],go:[4,'Mở AI rà soát hồ sơ'],go2:[10,'Mở Cài đặt (Nhật ký)'],
 a:'<p>Mục <b>🤖 AI rà soát hồ sơ</b> liệt kê các hồ sơ đang rà soát; phiếu 9 tiêu chí do Tổ trưởng ghi và xác nhận. Mở một hồ sơ trong <b>📁 Hồ sơ chuyên môn</b> để xem <b>Lịch sử xử lý và phản hồi</b> của hồ sơ đó.</p><p class="note">Toàn bộ thao tác của mọi người nằm ở <b>⚙️ Cài đặt hệ thống → Nhật ký thao tác</b>. Lưu ý: web không tự gọi AI, việc rà soát bằng AI được thực hiện trong Gemini của trường.</p>'},
{k:['thu hoi','rut lai'],go:[3,'Mở Hồ sơ chuyên môn'],a:'<p>Hồ sơ đang ở trạng thái <b>Đã nộp</b> (Tổ trưởng chưa tiếp nhận) thì giáo viên mở hồ sơ và bấm <b>Thu hồi hồ sơ</b> để sửa lại.</p>'},
{k:['chinh sua','nop lai','phien ban'],go:[3,'Mở Hồ sơ chuyên môn'],a:'<p>Hồ sơ <b>Cần chỉnh sửa</b>: mở hồ sơ, đọc phần phản hồi trong <b>Lịch sử xử lý</b>, sửa rồi bấm <b>Nộp hồ sơ</b>. Hồ sơ đã duyệt muốn cập nhật thì bấm <b>Nộp phiên bản mới</b>.</p>'},
{k:['q.doc','qdoc','duong dan','link'],go:[3,'Mở Hồ sơ chuyên môn'],a:'<p>Mở hồ sơ, tìm ô <b>Đường dẫn trên Q.DOC</b>, dán đường dẫn (bắt đầu bằng https://) rồi bấm <b>Lưu</b>. Tên tệp nên đặt theo gợi ý ngay dưới ô đó.</p>'},
{k:['sao luu','khoi phuc','backup','mat du lieu','xoa du lieu'],go:[10,'Mở Cài đặt hệ thống'],a:'<p>Dữ liệu chỉ lưu trong trình duyệt của thiết bị này. Vào <b>⚙️ Cài đặt hệ thống</b> bấm <b>Tải bản sao lưu (JSON)</b> định kỳ. Khôi phục từ tệp chỉ dành cho Quản trị viên.</p>'},
{k:['nhiem vu','giao viec','giao nhiem vu'],go:[2,'Mở Giao nhiệm vụ'],a:'<p>Cán bộ quản lý và Quản trị viên vào <b>📌 Giao nhiệm vụ</b>, bấm <b>+ Giao nhiệm vụ</b>. Giáo viên xem nhiệm vụ của điểm trường mình ở cùng mục.</p>'},
{k:['sinh hoat','bien ban'],go:[5,'Mở Sinh hoạt chuyên môn'],a:'<p>Vào <b>👥 Sinh hoạt chuyên môn</b>, bấm <b>+ Thêm</b> để ghi biên bản. Tổ trưởng của tổ đó bấm <b>Tổ trưởng xác nhận biên bản</b>.</p>'},
{k:['du gio','danh gia gio'],go:[6,'Mở Dự giờ'],a:'<p>Vào <b>🎓 Dự giờ và đánh giá</b>, bấm <b>+ Thêm</b> để ghi phiếu dự giờ. Mục này chỉ ghi nhận, hệ thống không tự chấm điểm hay xếp loại giáo viên.</p>'},
{k:['hoc lieu','kho','tai nguyen','dong gop'],go:[11,'Mở Kho học liệu'],a:'<p>Vào <b>📚 Kho học liệu</b>, bấm <b>+ Đóng góp tài nguyên</b>. Tài liệu hiển thị cho mọi người sau khi Tổ trưởng hoặc Cán bộ quản lý duyệt.</p>'},
{k:['csv','xuat','tai bang','in trang'],a:'<p>Các bảng có nút <b>Tải CSV</b> hoặc <b>Xuất CSV</b>. Muốn in, bấm biểu tượng 🖨 trên thanh đầu trang.</p>'},
{k:['vai tro','quyen','xem thu'],go:[10,'Xem phân quyền'],a:'<p>Hệ thống hiện chưa có đăng nhập; ô <b>Xem thử</b> trên đầu trang chỉ để chuyển vai trò xem giao diện. Bảng phân quyền chi tiết nằm ở <b>⚙️ Cài đặt hệ thống</b>.</p>'},
{k:['thong bao','chuong'],a:'<p>Bấm biểu tượng <b>🔔</b> trên đầu trang để xem việc cần xử lý như hồ sơ chờ duyệt, nhiệm vụ sắp đến hạn.</p>'},
{k:['che do toi','che do sang','giao dien'],a:'<p>Bấm biểu tượng <b>◐</b> trên đầu trang để đổi giữa chế độ sáng và tối.</p>'}
];

/* 2. Tra cứu nhanh hồ sơ theo vai trò đang xem */
function lookup(t){
 const pool=role=='gv'?D.docs.filter(d=>d.tid==R.gv.tid):role=='tt'?D.docs.filter(d=>d.to==ttTo):D.docs;
 const who=role=='gv'?'của thầy/cô':role=='tt'?'của '+ttTo:'toàn trường';
 const T=[[/ke hoach giao duc ca nhan|hskt|khuyet tat/,6],[/ke hoach bai day|giao an|khbd/,0],[/ke hoach giao duc/,1],[/bien ban|sinh hoat/,2],[/du gio/,3],[/bao cao/,4],[/so chu nhiem/,5]];
 let ty='';for(const [re,i] of T)if(re.test(t)){ty=TY[i];break}
 let ds=ty?pool.filter(d=>d.ty==ty):pool,when='',miss=false;
 const wn=t.match(/tuan\s*(\d+)/);
 if(wn){const n=+wn[1];ds=ds.filter(d=>(d.due&&wkOf(d.due)==n)||new RegExp('tuan\\s*'+n+'\\b').test(nz(d.name)));when=' tuần '+n}
 else if(/tuan nay/.test(t)){ds=ds.filter(d=>d.due&&wkOf(d.due)==CW);when=' trong tuần này (T'+CW+')'}
 else if(/qua han/.test(t)){ds=ds.filter(odDoc);when=' quá hạn'}
 else if(/cho (phe )?duyet/.test(t)){ds=ds.filter(d=>d.st=='Chờ duyệt');when=' đang chờ duyệt'}
 else if(/can chinh sua/.test(t)){ds=ds.filter(d=>d.st=='Cần chỉnh sửa');when=' cần chỉnh sửa'}
 else if(/chua nop/.test(t)){ds=ds.filter(d=>d.st=='Chưa nộp');when=' chưa nộp'}
 let note='';
 if(!ds.length&&ty&&when){miss=true;note='<p class="note">Chưa có hồ sơ '+esc(ty.toLowerCase())+when+'. Các hồ sơ cùng loại hiện có:</p>';ds=pool.filter(d=>d.ty==ty)}
 if(!ds.length)return'<p>Em chưa tìm thấy hồ sơ phù hợp '+who+(ty?' (loại '+esc(ty)+')':'')+'. Nếu chưa tạo, thầy/cô vào <b>📁 Hồ sơ chuyên môn → + Tạo hồ sơ</b> nhé.</p>';
 ds=[...ds].sort((a,b)=>(b.due||'').localeCompare(a.due||''));
 const sum=ALLST.map(s=>[s,cnt(ds,s)]).filter(x=>x[1]).map(x=>x[1]+' '+x[0].toLowerCase()).join(', ');
 const head=miss?'':'<p>Em tìm thấy <b>'+ds.length+'</b> hồ sơ'+(ty?' '+esc(ty.toLowerCase()):'')+when+' '+who+': '+esc(sum)+'.</p>';
 const rows=ds.slice(0,6).map(d=>`<button class="edb-row" data-doc="${esc(d.id)}">${esc(d.name)} ${pill(d.st)}<span class="note">${role=='gv'?'':esc(d.tname||'')+' · '}hạn ${esc(d.due||'không có')}</span></button>`).join('');
 const more=ds.length>6?`<p class="note">Và ${ds.length-6} hồ sơ khác.</p>`:'';
 return head+note+rows+more+`<p>${btnGo(3,'Mở danh sách đầy đủ').replace('data-go="3"','data-go="3" data-ty="'+esc(ty)+'"')}</p>`+(role=='gv'?'':'<p class="note">Bạn đang xem thử vai trò '+esc(R[role].l)+'.</p>');
}

/* 3. Ghi nhận lỗi: lưu trong dữ liệu ứng dụng (D.bugs), có trong bản sao lưu */
function saveBug(text){
 D.bugs=D.bugs||[];const n=D.bugs.length?Math.max(...D.bugs.map(b=>+String(b.id).slice(3)||0))+1:1;
 const b={id:'LOI'+String(n).padStart(3,'0'),at:nowTs().slice(0,16),by:ME().n,role:ME().l,page:LB[cur]||'',text:text.slice(0,500),st:'Mới'};
 D.bugs.unshift(b);D.bugs.splice(200);aud('Báo lỗi qua EduBot: '+b.id);save();return b}
function bugList(){
 const L=(D.bugs||[]);if(!L.length)return'<p>Chưa có báo lỗi nào.</p>';
 return'<p>Có <b>'+L.filter(b=>b.st!='Đã xử lý').length+'</b> lỗi chưa xử lý (tổng '+L.length+'):</p>'+L.slice(0,5).map(b=>`<div class="edb-row" style="cursor:default"><b>${esc(b.id)}</b> ${pill(b.st,b.st=='Mới'?'wa':'ok')}<span class="note">${esc(b.at)} · ${esc(b.by)} · ${esc(b.page)}</span>${esc(b.text)}${b.st=='Mới'?` <button class="edb-a" data-fix="${esc(b.id)}">Đã xử lý</button>`:''}</div>`).join('')+'<p><button class="edb-a" data-csv="1">Tải danh sách lỗi (CSV)</button></p>'}

function reply(raw){
 const t=nz(raw);
 if(wantBug){wantBug=false;if(/^(huy|thoi|khong)\b/.test(t))return'<p>Dạ, em đã huỷ báo lỗi ạ.</p>';const b=saveBug(raw);return'<p>Em đã ghi nhận lỗi <b>'+b.id+'</b> (màn hình “'+esc(b.page)+'”).</p><p class="note">Lỗi được lưu cùng dữ liệu của hệ thống trên thiết bị này; Quản trị viên xem bằng cách hỏi “danh sách lỗi”. Hãy gửi kèm bản sao lưu nếu cần chuyển cho bộ phận kỹ thuật.</p>'}
 if(/danh sach loi|xem loi|loi da bao/.test(t))return role=='ad'||role=='bgh'?bugList():'<p>Danh sách lỗi chỉ dành cho Quản trị viên và Cán bộ quản lý ạ.</p>';
 const help=/cach|lam sao|lam the nao|huong dan|o dau|the nao|nhu the nao/.test(t);
 if(/bao loi|loi |bi loi|su co|\bhong\b|treo|khong (luu|mo|hien|bam|tai|hoat dong)/.test(t)&&!/lich su/.test(t)){
  if(raw.length>=40){const b=saveBug(raw);return'<p>Em đã ghi nhận lỗi <b>'+b.id+'</b> (màn hình “'+esc(b.page)+'”). Cảm ơn thầy/cô ạ.</p><p class="note">Lỗi được lưu cùng dữ liệu trên thiết bị này.</p>'}
  wantBug=true;return'<p>Thầy/cô mô tả giúp em: đang thao tác ở đâu, bấm gì và thấy hiện tượng gì ạ? (Gõ “huỷ” nếu không muốn báo.)</p>'}
 if(!help&&/(da|duoc|chua).*(duyet|nop)|trang thai|tinh trang|cua toi|toi da|qua han|con thieu|cho (phe )?duyet|can chinh sua|ho so.*(tuan|thang)|tuan nay/.test(t))return lookup(t);
 let best=null,sc=0;for(const e of KB){const s=e.k.filter(k=>t.includes(k)).length;if(s>sc){sc=s;best=e}}
 if(best){let h=best.a;if(best.go)h+='<p>'+btnGo(best.go[0],best.go[1])+(best.go2?btnGo(best.go2[0],best.go2[1]):'')+'</p>';return h}
 if(/xin chao|^chao|hello|^hi\b/.test(t))return'<p>Xin chào! EduBot có thể giúp gì cho nghiệp vụ chuyên môn hôm nay ạ?</p>';
 if(/cam on|thanks/.test(t))return'<p>Dạ không có gì ạ!</p>';
 return'<p>Em chưa hiểu rõ câu hỏi. Em hỗ trợ ba việc: <b>hướng dẫn nghiệp vụ</b> (nộp hồ sơ, quy trình duyệt, sao lưu...), <b>tra cứu hồ sơ</b> (“hồ sơ giáo án tuần này đã duyệt chưa?”) và <b>báo lỗi</b> phần mềm. Thầy/cô thử hỏi lại ngắn gọn giúp em nhé.</p>'}

function send(q){const raw=(q||inp.value).trim();if(!raw)return;add('u',null,raw);inp.value='';chips.style.display='none';
 setTimeout(()=>{let h;try{h=reply(raw)}catch(e){h='<p>Em gặp sự cố khi xử lý câu hỏi này. Thầy/cô thử diễn đạt lại hoặc báo lỗi giúp em ạ.</p>'}add('b',h)},250)}
function setOpen(v){box.classList.toggle('on',v);g('edb-btn').setAttribute('aria-expanded',v);if(v)setTimeout(()=>inp.focus(),30);else g('edb-btn').focus()}

g('edb-btn').onclick=()=>setOpen(true);g('edb-x').onclick=()=>setOpen(false);g('edb-send').onclick=()=>send();
inp.addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.isComposing){e.preventDefault();send()}});
box.addEventListener('keydown',e=>{if(e.key=='Escape')setOpen(false)});
box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.q)send(b.dataset.q);
 else if(b.dataset.go){const i=+b.dataset.go;if(b.dataset.ty!==undefined){nav(i);hf.ty=b.dataset.ty;hf.st='';render()}else nav(i);if(innerWidth<=820)setOpen(false)}
 else if(b.dataset.doc){nav(3);openDoc(b.dataset.doc);if(innerWidth<=820)setOpen(false)}
 else if(b.dataset.csv){csvOut('loi-he-thong.csv',[['Mã','Thời điểm','Người báo','Vai trò','Màn hình','Nội dung','Trạng thái'],...(D.bugs||[]).map(x=>[x.id,x.at,x.by,x.role,x.page,x.text,x.st])])}
 else if(b.dataset.fix){const x=(D.bugs||[]).find(z=>z.id==b.dataset.fix);if(x&&(role=='ad'||role=='bgh')){x.st='Đã xử lý';aud('Đánh dấu đã xử lý lỗi '+x.id);save();b.closest('.edb-m').innerHTML=bugList()}}
});
add('b','<p>Xin chào! EduBot có thể giúp gì cho nghiệp vụ chuyên môn hôm nay ạ?</p>');
})();
</script>

<style id="luxe5">
/* ===== Luxe 5: bản sáng hơn – kem vàng tươi nhẹ, xanh lá/xanh lam sáng ===== */
:root[data-theme="light"]{
  --bg:#fcf7e2;--card:#fffcef;--sel:#f7eecb;--tx:#34433d;--mu:#76827a;--ln:rgba(150,118,40,.15);
  --blue:#2f7fa8;--ok:#2b8059;--okb:#e0f1d8;--wab:#f9e8b0;--erb:#f9ded0;
  --grad:linear-gradient(115deg,#3a9a78,#3a8db5);
  --sh1:0 1px 2px rgba(130,100,30,.06),0 6px 16px -8px rgba(130,100,30,.14);
  --sh2:0 2px 4px rgba(130,100,30,.08),0 14px 28px -12px rgba(130,100,30,.22);
}
:root[data-theme="light"] body{background:linear-gradient(180deg,#fefaea,#f9f1d3)!important}
:root[data-theme="light"] aside{background:linear-gradient(185deg,#fbf3d0,#f4e8bb)!important;border-right:1px solid rgba(150,118,40,.18)!important}
:root[data-theme="light"] .logo{color:#2b6a52!important}
:root[data-theme="light"] nav button{color:#40514a!important}
:root[data-theme="light"] nav button:hover{background:rgba(58,154,120,.12)!important;color:#256049!important}
:root[data-theme="light"] nav button.on{background:linear-gradient(100deg,#3a9a78,#3a8db5)!important;box-shadow:0 5px 12px -6px rgba(58,154,120,.55)!important}
:root[data-theme="light"] .top{background:rgba(255,252,239,.94)!important}
:root[data-theme="light"] .ban{background:#faebb4!important;color:#7a5510!important}
:root[data-theme="light"] .ct>h2,:root[data-theme="light"] .top h1,:root[data-theme="light"] dialog h2,:root[data-theme="light"] .card h2,:root[data-theme="light"] h2{color:#2b6a52!important}
:root[data-theme="light"] h3{color:#2f7fa8!important}
:root[data-theme="light"] .hero{background:linear-gradient(115deg,#3d9d7d,#3a97a8 55%,#4a95cc)!important;box-shadow:0 12px 24px -14px rgba(58,154,120,.55)!important}
:root[data-theme="light"] th{background:#f6e9b6!important;color:#6a4f14!important}
:root[data-theme="light"] tr:nth-child(even) td{background:rgba(200,160,60,.05)!important}
:root[data-theme="light"] tr.cl:hover td{background:rgba(58,154,120,.10)!important}
:root[data-theme="light"] .tr i{background:linear-gradient(90deg,#3a9a78,#3a8db5)!important}
:root[data-theme="light"] .btn{background:var(--grad)!important;box-shadow:0 5px 12px -6px rgba(58,154,120,.55)!important}
:root[data-theme="light"] .btn.g{background:#fbf3d3!important;border-color:rgba(150,118,40,.26)!important}
:root[data-theme="light"] .btn.g:hover{background:#f6e9bb!important}
:root[data-theme="light"] .chips button{background:#fbf3d3!important}
:root[data-theme="light"] select,:root[data-theme="light"] input,:root[data-theme="light"] textarea,:root[data-theme="light"] .who select{background-color:#fffaea!important;border-color:rgba(150,118,40,.26)!important}
:root[data-theme="light"] select option{background:#fffaea}
:root[data-theme="light"] .pv{background:#f8efcd!important}
:root[data-theme="light"] #toast{background:#2f7d63!important}
:root[data-theme="light"] .edb-h{background:linear-gradient(115deg,#3d9d7d,#3a97a8 60%,#4a95cc)!important}
:root[data-theme="light"] #edb-msgs,:root[data-theme="light"] #edb-chips{background:#f9f1d2!important}
:root[data-theme="light"] #edb-in{background:#fffaea!important}
:root[data-theme="light"] .edb-m.b,:root[data-theme="light"] .edb-a,:root[data-theme="light"] .edb-chip,:root[data-theme="light"] .edb-row{background:#fffcef!important}
/* màu số chỉ số: sáng hơn một nấc */
:root[data-theme="light"] .kpis button.kpi:nth-child(1),:root[data-theme="light"] .kpis button.kpi:nth-child(11){--c:#2f9a8f}
:root[data-theme="light"] .kpis button.kpi:nth-child(2),:root[data-theme="light"] .kpis button.kpi:nth-child(12){--c:#3f84c4}
:root[data-theme="light"] .kpis button.kpi:nth-child(3){--c:#6f6cc9}
:root[data-theme="light"] .kpis button.kpi:nth-child(4),:root[data-theme="light"] .kpis button.kpi:nth-child(8){--c:#3a9a62}
:root[data-theme="light"] .kpis button.kpi:nth-child(5),:root[data-theme="light"] .kpis button.kpi:nth-child(10){--c:#d96a58}
:root[data-theme="light"] .kpis button.kpi:nth-child(6),:root[data-theme="light"] .kpis button.kpi:nth-child(14){--c:#d6962a}
:root[data-theme="light"] .kpis button.kpi:nth-child(7){--c:#d2623f}
:root[data-theme="light"] .kpis button.kpi:nth-child(9){--c:#9166c8}
:root[data-theme="light"] .kpis button.kpi:nth-child(13){--c:#7d8a92}
</style>
<script>
(()=>{const h=document.documentElement;
/* Luôn mở ở bản sáng (vàng kem). Nút ◐ chỉ đổi tạm trong phiên xem, không ghi nhớ. */
h.dataset.theme='light';
window.theme=function(){h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'};
})();
</script>
<script>
(()=>{
const app=document.querySelector('.app'),mb=document.querySelector('.top>button'),mob=()=>innerWidth<=820;
if(mb){mb.textContent='☰ Menu';mb.setAttribute('aria-expanded','false')}
const sb0=window.sb,nav0=window.nav;
window.sb=function(){if(!mob())return sb0();const o=app.classList.toggle('mo');if(mb)mb.setAttribute('aria-expanded',o);if(o)window.scrollTo({top:0})};
window.nav=function(i){nav0(i);if(mob()){app.classList.remove('mo');if(mb)mb.setAttribute('aria-expanded','false');window.scrollTo({top:0})}};
})();
</script>

</body></html>
